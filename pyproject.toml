[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd"
version = "0.1.0"
description = "Progressive Disclosure Documentation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bacoco" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pdd = "pdd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
